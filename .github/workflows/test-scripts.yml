---
    name: Test Upload Scripts on debug-automation branch
    on:
      push:
        branches:
          - debug-automation  # Trigger only on this branch
      schedule:
        - cron: 0 20 * * *
      workflow_dispatch: null
    jobs:
      test-scripts:
        runs-on: ubuntu-latest
        environment: testing
        env:
          URI: ${{ secrets.URI }}
          API_KEY: ${{ secrets.API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
          API_REQUEST_LIMIT: ${{ vars.API_REQUEST_LIMIT }}
        steps:
          - name: Checkout Code
            uses: actions/checkout@v3
          - name: Set Up Python
            uses: actions/setup-python@v4
            with:
              python-version: "3.11"
          - name: Install Dependencies
            run: |
              python -m pip install --upgrade pip
              pip install -r backend/requirements.txt
          - name: Upload Price
            run: |
              python backend/upload_price.py 
          - name: Upload News
            run: |
              python backend/upload_news.py 
          - name: Show contents of logfile here for debugging
            run: |
              cat backend/upload_price.log
          - name: Show contents of logfile here for debugging
            run: |
              cat backend/upload_news.log
