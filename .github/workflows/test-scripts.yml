name: Test Upload Scripts

on:
  schedule:
    - cron: '0 20 * * *'  # Runs daily at 8:00 PM UTC
  workflow_dispatch:       # Allows manual triggering

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    environment: testing   # Refers to the 'testing' environment
    env:
      URI: ${{ secrets.URI }}
      API_KEY: ${{ secrets.API_KEY }}
      SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
      API_REQUEST_LIMIT: ${{ vars.API_REQUEST_LIMIT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run upload_price.py
        run: python backend/upload_price.py

      - name: Run upload_news.py
        run: python backend/upload_news.py
