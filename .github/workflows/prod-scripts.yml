name: Production Upload Scripts on main branch

on:
  schedule:
    - cron: '0 19 * * *'  # Runs daily at 3:00 PM UTC (4:00 PM BST)
  workflow_dispatch:       # Allows manual triggering

jobs:
  prod-scripts:
    runs-on: ubuntu-latest
    environment: testing
    env:
      URI: ${{ secrets.URI }}
      API_KEY: ${{ secrets.API_KEY }}
      SEARCH_ENGINE_ID: ${{ secrets.SEARCH_ENGINE_ID }}
      API_REQUEST_LIMIT: ${{ vars.API_REQUEST_LIMIT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify Secrets and Variables
        run: |
          echo "Checking environment variables..."
          echo "URI is set: ${{ secrets.URI != '' }}"
          echo "API_KEY is set: ${{ secrets.API_KEY != '' }}"
          echo "SEARCH_ENGINE_ID is set: ${{ secrets.SEARCH_ENGINE_ID != '' }}"
          echo "API_REQUEST_LIMIT: $API_REQUEST_LIMIT"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run upload_price.py
        run: |
          python backend/upload_price.py

      - name: Run upload_news.py
        run: |
          python backend/upload_news.py

      - name: Display Logs
        run: |
          cat backend/upload_price.log
          cat backend/upload_news.log